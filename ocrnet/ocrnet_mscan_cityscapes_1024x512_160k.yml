_base_: '../_base_/cityscapes.yml'

batch_size: 2
iters: 40000

model:
  type: OCRNet
  backbone:
    type: MSCAN_B
    pretrained: https://paddleseg.bj.bcebos.com/dygraph/backbone/mscan_b_imagenet_pretrained.zip
  num_classes: 3
  backbone_indices: [0]

optimizer:
  type: SGD

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.01
  power: 0.9


loss:
  types:
    - type: MixedLoss
      losses:
        - type: CrossEntropyLoss
        - type: LovaszSoftmaxLoss
      coef: [0.8, 0.2]
    - type: MixedLoss
      losses:
        - type: CrossEntropyLoss
        - type: LovaszSoftmaxLoss
      coef: [0.8, 0.2]
  coef: [1, 0.4]
