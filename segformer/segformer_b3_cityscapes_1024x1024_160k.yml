_base_: '../_base_/mydataset.yml'

batch_size: 2
iters: 40000

model:
  type: SegFormer
  backbone:
    type: SwinTransformer_tiny_patch4_window7_224
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/backbone/SwinTransformer_tiny_patch4_window7_224.tar.gz
  embedding_dim: 768
  num_classes: 3

optimizer:
  _inherited_: False
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.0001
  power: 2

loss:
  types:
    - type: CrossEntropyLoss
  coef: [1]

test_config:
    is_slide: True
    crop_size: [1024, 1024]
    stride: [768, 768]
